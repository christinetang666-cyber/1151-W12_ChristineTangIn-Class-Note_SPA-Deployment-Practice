<text x="72" y="335" class="section" text-anchor="start">THE PRODUCT-DEVELOPMENT PROCESS</text>
<text x="72" y="368" class="small" text-anchor="start">A connected path from understanding a need to evaluating market value.</text>
<rect x="110" y="405" width="980" height="132" rx="20" fill="#EDF6FF" stroke="#B9D8F0" stroke-width="2"/>
<text x="145" y="445" class="cardtitle" text-anchor="start">01  IDENTIFY THE NEED</text>
<text x="145" y="481" class="body" text-anchor="start">Understand demand and the problem.</text>
<text x="145" y="508" class="body" text-anchor="start">Consider what users need and what can be supplied.</text>
<rect x="110" y="570" width="980" height="158" rx="20" fill="#EEF8F6" stroke="#B9E2D8" stroke-width="2"/>
<text x="145" y="610" class="cardtitle" text-anchor="start">02  ANALYZE THE PROBLEM</text>
<text x="145" y="646" class="body" text-anchor="start">Break the problem into smaller components.</text>
<text x="145" y="673" class="body" text-anchor="start">Form questions; investigate each part.</text>
<text x="145" y="700" class="body" text-anchor="start">Use evidence and examples, then recombine findings.</text>
<rect x="110" y="765" width="980" height="132" rx="20" fill="#F2F0FF" stroke="#D4CCF5" stroke-width="2"/>
<text x="145" y="805" class="cardtitle" text-anchor="start">03  DEFINE REQUIREMENTS  ·  PRD</text>
<text x="145" y="841" class="body" text-anchor="start">Translate user needs into product requirements.</text>
<text x="145" y="868" class="body" text-anchor="start">Specify functions and verify that they work as intended.</text>
<rect x="110" y="930" width="980" height="132" rx="20" fill="#FFF7E9" stroke="#F0D7A8" stroke-width="2"/>
<text x="145" y="970" class="cardtitle" text-anchor="start">04  BUILD THE MVP</text>
<text x="145" y="1006" class="body" text-anchor="start">Minimum Viable Product: start with the minimum</text>
<text x="145" y="1033" class="body" text-anchor="start">viable functions needed to demonstrate value.</text>
<rect x="110" y="1095" width="980" height="158" rx="20" fill="#EDF6FF" stroke="#B9D8F0" stroke-width="2"/>
<text x="145" y="1135" class="cardtitle" text-anchor="start">05  DEVELOP THE APPLICATION</text>
<text x="145" y="1171" class="body" text-anchor="start">BNA Agent as software / app / application.</text>
<text x="145" y="1198" class="body" text-anchor="start">SPA: a single-page application prepared as an HTML file.</text>
<text x="145" y="1225" class="body" text-anchor="start">Consider simple, clear UI and different device displays.</text>
<rect x="110" y="1290" width="980" height="158" rx="20" fill="#EEF8F6" stroke="#B9E2D8" stroke-width="2"/>
<text x="145" y="1330" class="cardtitle" text-anchor="start">06  COLLABORATE, DEPLOY &amp; TEST</text>
<text x="145" y="1366" class="body" text-anchor="start">Team members take turns in one shared AI chat session.</text>
<text x="145" y="1393" class="body" text-anchor="start">Use handoff.md to pass context, progress and next steps.</text>
<text x="145" y="1420" class="body" text-anchor="start">Deploy the app and share the deployment link.</text>
<rect x="110" y="1485" width="980" height="158" rx="20" fill="#FFF7E9" stroke="#F0D7A8" stroke-width="2"/>
<text x="145" y="1525" class="cardtitle" text-anchor="start">07  EVALUATE COMMERCIAL POTENTIAL</text>
<text x="145" y="1561" class="body" text-anchor="start">Connect producers, the market and consumers.</text>
<text x="145" y="1588" class="body" text-anchor="start">Consider commercial value and WTP (Willingness to Pay).</text>
<text x="145" y="1615" class="body" text-anchor="start">SaaS is noted as a possible web-based service model.</text>

<text x="105" y="1790" class="tag" text-anchor="start">ANALYTICAL THINKING</text>
<text x="105" y="1822" class="body" text-anchor="start">Separate → question → investigate →</text>
<text x="105" y="1848" class="body" text-anchor="start">support with evidence → recombine.</text>
<text x="620" y="1790" class="tag" text-anchor="start">EFFECTIVE vs. EFFICIENT</text>
<text x="620" y="1822" class="body" text-anchor="start">Effective: reach the goal or purpose.</text>
<text x="620" y="1848" class="body" text-anchor="start">Efficient: consider output in relation to input.</text>
